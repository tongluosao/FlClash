name: release-linux-legacy

# GitHub retired the hosted `ubuntu-20.04` label in April 2025, so a glibc 2.31
# package is produced inside a 20.04 container on ubuntu-latest instead. It stays
# out of build.yaml because that release job only publishes from chen08209/FlClash
# and waits on the whole check suite, which a fork does not carry (its changelog
# tags are missing). The assets are suffixed, so they land beside the regular
# release files of the same tag.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag whose release receives the packages; empty builds only
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  SUFFIX: ubuntu20.04
  # appimagetool is itself an AppImage and a container exposes no FUSE.
  APPIMAGE_EXTRACT_AND_RUN: '1'

jobs:
  build:
    name: Linux amd64
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      options: --user root
    permissions:
      contents: read
    steps:
      # Nothing is preinstalled in the bare image, and actions/checkout needs git,
      # so the toolchain comes first.
      - name: Install the 20.04 toolchain
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang cmake curl fakeroot file git jq libblkid-dev \
            libfuse2 libgtk-3-dev liblzma-dev libayatana-appindicator3-dev libsecret-1-dev \
            locate ninja-build patchelf pkg-config rpm sudo unzip wget xz-utils zip
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The sqlite3 package downloads a prebuilt libsqlite3.so that references glibc
      # 2.33 symbols, which is above the 2.31 this image provides, so the app died on
      # the first database call. Its build hook can compile the amalgamation instead:
      # `source` is set for Linux only, so every other platform keeps the upstream
      # prebuilt, and the sources are fetched here rather than pinned in the pubspec,
      # where an absolute path would break the other builds.
      - name: Build SQLite against this glibc
        shell: bash
        env:
          SQLITE_AMALGAMATION: sqlite-amalgamation-3540100.zip
          SQLITE_SOURCES: /opt/sqlite-src
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/sqlite-amalgamation.zip \
            "https://sqlite.org/2026/$SQLITE_AMALGAMATION"
          unzip -q -o /tmp/sqlite-amalgamation.zip -d /opt
          mkdir -p "$SQLITE_SOURCES"
          mv "/opt/${SQLITE_AMALGAMATION%.zip}"/* "$SQLITE_SOURCES"
          test -f "$SQLITE_SOURCES/sqlite3.c"

          cat > /tmp/sqlite-defines.yaml <<'EOF'
              sqlite3:
                source:
                  linux: source
                path: /opt/sqlite-src/sqlite3.c
                additional_includes:
                  - /opt/sqlite-src
          EOF
          sed -i '/^  user_defines:$/r /tmp/sqlite-defines.yaml' pubspec.yaml
          grep -c 'path: /opt/sqlite-src/sqlite3.c' pubspec.yaml
          sed -n '8,22p' pubspec.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # The Core and Helper build hooks shell out to cargo, which the hosted
      # images happen to ship and this container does not.
      - name: Setup Rust
        env:
          # HOME is /github/home while the container runs as root, so rustup needs
          # both paths spelled out to land them somewhere stable.
          CARGO_HOME: /github/home/.cargo
          RUSTUP_HOME: /github/home/.rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain stable
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      # The plugins are written against glib 2.66+/2.70+ while 20.04 ships 2.64:
      # g_steal_pointer keeps the pointer type for C++ only from 2.66, and
      # g_spawn_check_wait_status is the 2.70 rename of g_spawn_check_exit_status.
      # Both are compile-time only, so patching the headers keeps the runtime
      # dependency at whatever 20.04 provides.
      - name: Teach glib 2.64 the newer plumbing
        shell: bash
        run: |
          set -euo pipefail
          steal_header=$(grep -rl 'define g_steal_pointer' /usr/include/glib-2.0 | head -n 1)
          [ -n "$steal_header" ] || { echo 'no header defines g_steal_pointer'; exit 1; }
          cat >> "$steal_header" <<'EOF'

          #ifndef FLCLASH_GLIB_COMPAT_STEAL_POINTER
          #define FLCLASH_GLIB_COMPAT_STEAL_POINTER 1
          #ifdef __cplusplus
          template <typename T>
          static inline T * flclash_steal_pointer (T **pp)
          {
            T *ret = *pp;
            *pp = NULL;
            return ret;
          }
          #undef g_steal_pointer
          #define g_steal_pointer(pp) flclash_steal_pointer (pp)
          #endif
          #endif
          EOF
          cat >> /usr/include/glib-2.0/glib/gspawn.h <<'EOF'

          #ifndef FLCLASH_GLIB_COMPAT_SPAWN
          #define FLCLASH_GLIB_COMPAT_SPAWN 1
          #define g_spawn_check_wait_status(status, error) g_spawn_check_exit_status (status, error)
          #endif
          EOF
          grep -c flclash_steal_pointer "$steal_header"
          grep -c g_spawn_check_wait_status /usr/include/glib-2.0/glib/gspawn.h

      # The core embeds this bundle and FlClashHttpOverrides.trustCoreRoots loads it for Dart.
      # Pinned by hash, so a new bundle from https://curl.se/docs/caextract.html is a reviewed bump.
      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Setup
        run: dart setup.dart linux ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      # A dependency that raises the glibc floor only fails on the user's machine,
      # after the release is out, so the bundle is checked against 2.31 here.
      - name: Verify the glibc floor
        shell: bash
        run: |
          set -euo pipefail
          floor=2.31
          status=0
          checked=0
          while IFS= read -r library; do
            highest=$(readelf --version-info "$library" 2>/dev/null |
              grep -o 'GLIBC_[0-9]\+\.[0-9]\+' | sed 's/^GLIBC_//' | sort -uV | tail -n 1)
            [ -n "$highest" ] || continue
            checked=$((checked + 1))
            if [ "$(printf '%s\n%s\n' "$highest" "$floor" | sort -V | tail -n 1)" != "$floor" ]; then
              echo "FAIL $(basename "$library") needs GLIBC_$highest"
              status=1
            fi
          done < <(find build -path '*release/bundle*' -name '*.so*' -type f)
          if [ "$checked" -eq 0 ]; then
            echo 'nothing was inspected: the bundle is not where it was expected'
            exit 1
          fi
          echo "checked $checked libraries against GLIBC_$floor"
          exit "$status"

      - name: Suffix the packages
        shell: bash
        run: |
          set -euo pipefail
          for file in dist/*; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            mv "$file" "dist/${name%.*}-${SUFFIX}.${name##*.}"
          done
          ls -l dist

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-amd64-${{ env.SUFFIX }}
          path: ./dist
          overwrite: true

  release:
    name: Publish
    needs: build
    if: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-pre.')) || inputs.release_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          name: artifact-linux-amd64-${{ env.SUFFIX }}
          path: dist

      - name: Generate sha256
        working-directory: dist
        run: sha256sum ./* > SHA256SUMS-${{ env.SUFFIX }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
